services:
  db:
    image: postgres:16-alpine
    container_name: kraefegg-db
    environment:
      POSTGRES_USER: kraefegg
      POSTGRES_PASSWORD: kraefegg_dev
      POSTGRES_DB: kraefegg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kraefegg -d kraefegg"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
