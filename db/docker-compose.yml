services:
  db:
    image: postgres:16-alpine
    container_name: kraefegg-db
    environment:
      POSTGRES_USER: kraefegg
      POSTGRES_PASSWORD: kraefegg_dev
      POSTGRES_DB: kraefegg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kraefegg -d kraefegg"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: kraefegg-mongo
    # Perfil "local": só sobe junto com docker compose --profile local up -d
    # Quando usar MongoDB Atlas (produção), o Mongo local é desnecessário.
    profiles: ["local-mongo"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: kraefegg
      MONGO_INITDB_ROOT_PASSWORD: kraefegg_dev
      MONGO_INITDB_DATABASE: kraefegg_telemetry
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      - ./mongodb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  mongodata:
